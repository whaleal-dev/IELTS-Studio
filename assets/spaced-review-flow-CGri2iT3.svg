<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 964" role="img" aria-labelledby="title description">
  <title id="title">错题间隔复习推进与重置流程</title>
  <desc id="description">实际答错记录错误时间并回到第一阶段，按已保存设置安排到期。到期首次独立答对才推进一级，六阶段末级保持；再次答错回到第一阶段并重新安排到期。提前答对、看材料后答对或自评不推进，重新隐藏不撤销查看标记；看材料后实际答错仍重置。读取或保存失败保留当前题目和操作，按提示重试。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3b74d7" stroke-width="2"/></marker>
  </defs>
  <rect width="360" height="964" rx="20" fill="#f3f7fc"/>
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="middle" fill="#20324f">
    <text x="180" y="38" font-size="22" font-weight="700">错题间隔复习流程</text>
    <rect x="20" y="62" width="320" height="86" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="91" font-weight="700">实际答错</text>
    <text x="180" y="118">记录错误时间，回到第一阶段</text>
    <path d="M180 154V174" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="184" width="320" height="86" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="218">按已保存设置</text>
    <text x="180" y="245">安排下一次到期时间</text>
    <path d="M180 276V296" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="306" width="320" height="86" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="340">到期后再次练习</text>
    <text x="180" y="367">首次独立作答</text>
    <path d="M180 398V410H95V424" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M180 410H265V424" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="434" width="150" height="118" rx="12" fill="#edf7ee" stroke="#bfd8c3"/>
    <text x="95" y="467" font-weight="700" fill="#315c3f">答对</text>
    <text x="95" y="498">推进一级</text>
    <text x="95" y="529">六阶段末级保持</text>
    <rect x="190" y="434" width="150" height="118" rx="12" fill="#fff5e8" stroke="#e8cd9f"/>
    <text x="265" y="467" font-weight="700" fill="#705636">再次答错</text>
    <text x="265" y="498">回到第一阶段</text>
    <text x="265" y="529">重新安排到期</text>
    <rect x="20" y="580" width="320" height="140" rx="12" fill="#fff5e8" stroke="#e8cd9f"/>
    <text x="180" y="612" font-weight="700" fill="#705636">提醒：以下答对不推进</text>
    <text x="180" y="642">提前作答、看材料后作答</text>
    <text x="180" y="669">或自评掌握</text>
    <text x="180" y="696">重新隐藏不撤销查看标记</text>
    <rect x="20" y="744" width="320" height="86" rx="12" fill="#fff5e8" stroke="#e8cd9f"/>
    <text x="180" y="778" font-weight="700" fill="#705636">查看材料后若实际答错</text>
    <text x="180" y="805">仍会重置到第一阶段</text>
    <rect x="20" y="854" width="320" height="86" rx="12" fill="#fff5e8" stroke="#e8cd9f"/>
    <text x="180" y="883" font-weight="700" fill="#705636">读取或保存失败</text>
    <text x="180" y="910">保留当前题目和操作，重试</text>
  </g>
</svg>
