<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" role="img" aria-labelledby="title description">
  <title id="title">恢复完整备份操作流程</title>
  <desc id="description">先下载现有资料的备份并在浏览器确认文件，再选择备份文件核对覆盖范围，输入恢复备份并最终确认。恢复替换全部学习资料和公共设置，成功后不能一键撤回。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3b74d7" stroke-width="2"/></marker></defs>
  <rect width="320" height="460" rx="20" fill="#f3f7fc"/>
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="160" y="35" font-size="20" font-weight="700" fill="#20324f">恢复前先保留现有资料</text>
    <rect x="24" y="54" width="272" height="68" rx="13" fill="#fff" stroke="#d8e3f2"/>
    <text x="160" y="82" font-size="20" font-weight="700" fill="#244d94">先下载现有资料备份</text>
    <text x="160" y="108" font-size="18" fill="#52617a">在浏览器下载列表确认文件</text>
    <path d="M160 128V151" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="164" width="272" height="60" rx="13" fill="#fff" stroke="#d8e3f2"/>
    <text x="160" y="201" font-size="20" font-weight="700" fill="#244d94">选备份文件，核对范围</text>
    <path d="M160 230V253" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="266" width="272" height="68" rx="13" fill="#fff" stroke="#d8e3f2"/>
    <text x="160" y="294" font-size="20" font-weight="700" fill="#244d94">输入「恢复备份」</text>
    <text x="160" y="320" font-size="18" fill="#52617a">核对后最终确认</text>
    <path d="M160 340V363" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="376" width="272" height="60" rx="13" fill="#fff5e8" stroke="#e8cd9f"/>
    <text x="160" y="401" font-size="20" font-weight="700" fill="#705636">替换全部学习资料与公共设置</text>
    <text x="160" y="425" font-size="18" fill="#705636">成功后不能一键撤回</text>
  </g>
</svg>
