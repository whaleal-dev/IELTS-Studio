<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1090" role="img" aria-labelledby="title description">
  <title id="title">音频与词表混排流程</title>
  <desc id="description">选择或拖入音频、CSV、TXT、Excel 后自动校验并预览，核对过滤结果后确认追加，列表累计最多 100 份。词表均无表头，Excel 只读首表、逐行逐格读取；纯数字是否播放由单词过滤设置决定。预览不改变列表或历史；检查失败整批拒绝，保留旧列表。逐行设置，或应用统一播放设置按类型覆盖，之后仍可逐行修改。录音调音频播放速度，词表调语音和每词间隔；循环 1～10 次，录音重复整段，词表重复整表。播放中排序保留当前文件、位置和遍次。暂停保留已完成遍数；录音继续保留时间断点，词表继续从当前词开头重读。追加或移出前先暂停。播放失败停止重试，不静默跳过；刷新需重新导入，仅历史设置纳入备份。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#3b74d7" stroke-width="2"/></marker></defs>
  <rect width="360" height="1090" rx="20" fill="#f3f7fc"/>
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#20324f">
    <text x="180" y="38" font-size="22" font-weight="700">音频与词表混排流程</text>
    <rect x="20" y="64" width="320" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="88" font-size="18" font-weight="600">选择或拖入音频与词表</text>
    <text x="180" y="112" font-size="18">CSV／TXT／Excel，最多 100 份</text>
    <text x="180" y="136" font-size="18">自动校验并生成解析预览</text>
    <path d="M180 144V170" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="178" width="320" height="52" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="212" font-size="18" font-weight="600">核对格式、容量与过滤结果</text>
    <path d="M180 230V250H95V274" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M180 250H265V274" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="282" width="150" height="108" rx="12" fill="#fff5e6" stroke="#e3c18c"/>
    <text x="95" y="316" font-size="18" font-weight="600">检查失败</text>
    <text x="95" y="344" font-size="18">整批拒绝</text>
    <text x="95" y="372" font-size="18">保留已有列表</text>
    <rect x="190" y="282" width="150" height="80" rx="12" fill="#eaf7ef" stroke="#9bc8ab"/>
    <text x="265" y="316" font-size="18" font-weight="600">检查通过</text>
    <text x="265" y="344" font-size="18">确认后追加</text>
    <path d="M265 362V404H180V430" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="438" width="320" height="108" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="472" font-size="18" font-weight="600">逐行设置或应用统一播放设置</text>
    <text x="180" y="500" font-size="18">录音调速度，词表调语音与间隔</text>
    <text x="180" y="528" font-size="18">整段／整表循环 1～10 次</text>
    <path d="M180 546V574" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="582" width="320" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="616" font-size="18" font-weight="600">排序后播放</text>
    <text x="180" y="644" font-size="18">播放中排序保留位置与遍次</text>
    <path d="M180 662V690" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="698" width="320" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="732" font-size="18" font-weight="600">暂停：保留已完成遍数</text>
    <text x="180" y="760" font-size="18">追加或移出列表前先暂停</text>
    <path d="M180 778V798H95V822" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M180 798H265V822" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="830" width="150" height="80" rx="12" fill="#eaf7ef" stroke="#9bc8ab"/>
    <text x="95" y="864" font-size="18" font-weight="600">录音继续</text>
    <text x="95" y="892" font-size="18">保留时间断点</text>
    <rect x="190" y="830" width="150" height="108" rx="12" fill="#eaf7ef" stroke="#9bc8ab"/>
    <text x="265" y="864" font-size="18" font-weight="600">词表继续</text>
    <text x="265" y="892" font-size="18">从当前词开头</text>
    <text x="265" y="920" font-size="18">重新朗读</text>
    <rect x="20" y="958" width="320" height="108" rx="12" fill="#fff5e6" stroke="#e3c18c"/>
    <text x="180" y="992" font-size="18" font-weight="600">播放失败停止，重试不跳过</text>
    <text x="180" y="1020" font-size="18">刷新需重新导入文件</text>
    <text x="180" y="1048" font-size="18">仅历史设置纳入备份</text>
  </g>
</svg>
