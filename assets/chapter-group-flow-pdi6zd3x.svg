<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 858" role="img" aria-labelledby="title description">
  <title id="title">词库与章节分组学习</title>
  <desc id="description">学习页选择词库和章节，直接选择分组进入学习。我的词库点击查看章节，展开章节后仅浏览分组与进度，不改变学习任务；点击分组才进入学习。两条主路径均直接进入所选分组；重选当前章节是可选操作，保留本轮与位置。单词使用固定入口，标签、词库和章组选择不增加浏览历史；离页暂停，返回不自动播放。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#3b74d7" stroke-width="2"/></marker></defs>
  <rect width="360" height="858" rx="20" fill="#f3f7fc"/>
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#20324f">
    <text x="180" y="38" font-size="22" font-weight="700">词库与章节分组学习</text>
    <rect x="20" y="64" width="150" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="95" y="98" font-size="18" font-weight="600">开始学习页</text>
    <text x="95" y="126" font-size="18">选择学习词库</text>
    <rect x="190" y="64" width="150" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="265" y="98" font-size="18" font-weight="600">我的词库页</text>
    <text x="265" y="126" font-size="18">点击查看章节</text>
    <path d="M95 144V174" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M265 144V174" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="182" width="150" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="95" y="216" font-size="18" font-weight="600">选择章节</text>
    <text x="95" y="244" font-size="18">查看章内分组</text>
    <rect x="190" y="182" width="150" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="265" y="216" font-size="18" font-weight="600">展开章节</text>
    <text x="265" y="244" font-size="18">浏览分组与进度</text>
    <path d="M95 262V292" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M265 262V292" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="300" width="150" height="80" rx="12" fill="#fff5e6" stroke="#e3c18c"/>
    <text x="95" y="334" font-size="18" font-weight="600">直接选择分组</text>
    <text x="95" y="362" font-size="18">进入所选组学习</text>
    <rect x="190" y="300" width="150" height="80" rx="12" fill="#fff5e6" stroke="#e3c18c"/>
    <text x="265" y="334" font-size="18" font-weight="600">仅浏览</text>
    <text x="265" y="362" font-size="18">不改变学习任务</text>
    <path d="M265 380V410" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="190" y="418" width="150" height="80" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="265" y="452" font-size="18" font-weight="600">点击分组</text>
    <text x="265" y="480" font-size="18">即进入学习</text>
    <path d="M95 380V514H180V526" fill="none" stroke="#3b74d7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M265 498V514H180" fill="none" stroke="#3b74d7" stroke-width="2"/>
    <rect x="20" y="534" width="320" height="80" rx="12" fill="#eaf7ef" stroke="#9bc8ab"/>
    <text x="180" y="568" font-size="18" font-weight="600">进入所选分组学习</text>
    <text x="180" y="596" font-size="18">核对练习卡片的名称与位置</text>
    <rect x="20" y="632" width="320" height="80" rx="12" fill="#fff" stroke="#d8e3f2" stroke-dasharray="6 4"/>
    <text x="180" y="666" font-size="18" font-weight="600">可选：重选当前章节</text>
    <text x="180" y="694" font-size="18">保留本轮和学习位置</text>
    <rect x="20" y="730" width="320" height="56" rx="12" fill="#fff5e6" stroke="#e3c18c"/>
    <text x="180" y="753" font-size="18" font-weight="600">单词使用固定入口</text>
    <text x="180" y="777" font-size="18">内部选择不增加浏览历史</text>
    <rect x="20" y="804" width="320" height="40" rx="12" fill="#fff" stroke="#d8e3f2"/>
    <text x="180" y="830" font-size="18">离页暂停，返回不自动播放</text>
  </g>
</svg>
